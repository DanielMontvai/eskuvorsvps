<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visszajelzés (RSVP) - Esküvő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="rsvp-oldal">

    <header class="header-container">
        <img src="kepek/rsvphez.jpeg" alt="Esküvői borítókép" id="top-image">
    </header>

    <nav class="navbar">
        <ul>
            <li><a href="fooldal.html">Főoldal</a></li>
            <li><a href="menetrend.html">Menetrend</a></li>
            <li><a href="helyszin.html">Helyszín</a></li>
            <li><a href="RSVP.html" class="active">RSVP</a></li>
        </ul>
    </nav>

    <!-- Kép a menüsor alatt -->
    <div class="rsvp-banner-container">
        <img src="kepek/rsvpnathan.png" alt="nathanp" class="rsvp-banner-img">
    </div>

    <main class="content">
        <h1>Visszajelzés (RSVP)</h1>
        <p>Kérjük, töltsd ki az alábbi űrlapot, hogy tudjuk, számíthatunk-e rád!</p>

        <form action="https://formspree.io/f/xwlvzknk" method="POST" id="rsvp-form">
            <div class="form-group">
                <label for="nev">Név: *</label>
                <input type="text" id="nev" name="nev" required placeholder="Add meg a neved! Ha lehet, úgy hogy felismerjünk! :)">
            </div>

            <div class="form-group">
                <label>Tudsz jönni? *</label>
                <div class="radio-group">
                    <label><input type="radio" name="tudok_jonni" value="igen" id="jovok-igen" required> Igen</label>
                    <label><input type="radio" name="tudok_jonni" value="nem" id="jovok-nem"> Nem</label>
                </div>
            </div>

            <div id="extra-questions" style="display: none;">
                <div class="form-group">
                    <label>Szertartáson ott leszek</label>
                    <div class="radio-group">
                        <label><input type="radio" name="templomi" value="igen"> Igen</label>
                        <label><input type="radio" name="templomi" value="nem"> Nem</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Vacsorán ott leszek.</label>
                    <div class="radio-group">
                        <label><input type="radio" name="szertartas" value="igen"> Igen</label>
                        <label><input type="radio" name="szertartas" value="nem"> Nem</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Maradok a bulira!</label>
                    <div class="radio-group">
                        <label><input type="radio" name="vacsora_buli" value="igen"> Naná!</label>
                        <label><input type="radio" name="vacsora_buli" value="nem"> Inkább megyek aludni, de ti érezzétek jól magatokat!</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="allergia">Ételallergia / érzékenység, egyéb kívánság:</label>
                <input type="text" id="allergia" name="allergia" placeholder="Pl. laktózérzékeny, vegetáriánus...">
            </div>

            <div class="form-group">
                <label for="uzenet">Megjegyzés / Üzenet a párnak:</label>
                <textarea id="uzenet" name="uzenet" rows="4" placeholder="Hoznál valakit magaddal? 
Szükséged van valami extrára?
Nagyon szeretsz minket és ezt mindenképp meg szeretnéd osztani velünk?
Kérdés-kérés, óhaj-sóhaj, móka-kacagás? Itt írd meg nekünk!"></textarea>
            </div>

            <button type="submit" class="submit-btn">Visszajelzés elküldése</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
